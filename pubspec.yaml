name: soberania_alimentaria_app
description: >
  Prototipo de app móvil para captura offline de los formularios de
  diagnóstico de cadena de valor agroecológica (Proyecto SECIHTI 2026,
  Redes de Producción Agroalimentaria Resilientes - UADY).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logos/

